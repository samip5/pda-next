{% extends "account/base.html" %}
{% load static %}
{% load i18n %}
{% load form_tags %}
{% block body %}
<div class="h-screen bg-no-repeat bg-cover bg-fixed bg-bottom flex flex-col items-center justify-center gap-4" style="background-image: url('{% static 'images/login.jpg' %}');" loading="lazy">
    <div class="bg-neutral-800 rounded-lg p-4 m-16 w-full md:w-1/6 ">

    <h4 class="text-white text-center">{% translate "Two-Factor Authentication" %}</h4>
    <form class="pda-form" method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% render_text_input form.otp_token %}
      <button type="submit" class="btn btn-primary mt-3">
        {% translate 'Verify' %}
      </button>
    </form>
    </div>
</div>
{% endblock %}
{% block footer %}{% endblock %}
