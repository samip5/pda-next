{% extends "web/app/app_base.html" %}
{% load static %}
{% load i18n %}
{% block app %}
<section class="bg-neutral-800 m-2 p-2 rounded-lg shadow">
    <h1 class="text-2xl font-semibold mb-5">Groups</h1>
    <div x-data="{ open: false }">
        <!-- Button -->
        <button @click="open = true" class="btn btn-primary mb-4">
            <i class="fa fa-plus"></i>
        </button>
        <!-- Backdrop -->
        <div x-show="open"
             x-transition.opacity
             @click="open = false"
             class="fixed inset-0 bg-black/50">
        </div>
        <!-- Modal -->
        <div x-show="open"
             x-transition
             class="fixed inset-0 flex items-center justify-center p-4"
             @keydown.escape.window="open = false">
            <div class="bg-neutral-800 rounded-lg shadow p-6 w-full max-w-md"
                 @click.stop>
                <h2>Create Group</h2>
                <form class="pda-form" method="post">
                    {% csrf_token %}
                    <div class="pda-input-group">
                        {{ group_form.name.label_tag }}
                        {{ group_form.name }}
                        {{ group_form.name.errors }}
                    </div>

                    <input class="btn btn-primary" type="submit" value="{% translate 'Create' %}">
                </form>
                <button @click="open = false" class="btn btn-secondary">
                    Close
                </button>
            </div>
        </div>
    </div>
    <table class="pda-table w-1/3">
      <thead>
        <tr>
            <th>Name</th>
            <th></th>
        </tr>
      </thead>
      <tbody>
        {% for group in groups %}
        <tr>
            <td><a class="text-white" href="/admin/groups/{{ group.id }}">{{ group.name }}</a></td>
            <td>
                <span class="pg-icon bg-danger p-3 rounded-3 text-white"><i class="fa fa-trash-o"></i></span>
                <a href="/admin/groups/{{ group.id }}"><span class="pg-icon bg-warning p-3 rounded-3 text-white"><i class="fa fa-pencil-square"></i></span></a>
            </td>
        </tr>

        {% endfor %}
      </tbody>
    </table>
</section>
{% endblock %}
