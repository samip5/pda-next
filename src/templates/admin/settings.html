{% extends "web/app/app_base.html" %}
{% load static %}
{% load i18n %}
{% block app %}
<section class="app-card">
    <h1 class="pg-title">Settings</h1>
    <div class="pg-columns">
        <div class="pg-column-one-third">
            <h2 class="pg-title">Settings 1</h2>
            {% for setting in settings %}
                <p class="text-white">{{ setting.name }}: {{ setting.value }}</p>
            {% endfor %}
        </div>
        <div class="pg-column-one-third">
            <h2 class="pg-title">LDAP</h2>
            <form method="post" class="pda-form">
                {% csrf_token %}
                    <div class="pda-input-group">
                        <label for="auth_ldap_server_uri">auth_ldap_server_uri</label>
                        <input type="text" class="form-control" name="auth_ldap_server_uri" id="auth_ldap_server_uri" value="{{ ldap_settings.auth_ldap_server_uri }}">
                    </div>
                    <div class="pda-input-group">
                        <label for="auth_ldap_bind_dn">auth_ldap_bind_dn</label>
                        <input type="text" class="form-control" name="auth_ldap_bind_dn" id="auth_ldap_bind_dn" value="{{ ldap_settings.auth_ldap_bind_dn }}">
                    </div>
                    <div class="pda-input-group">
                        <label for="auth_ldap_bind_password">auth_ldap_bind_password</label>
                        <input type="password" class="form-control" name="auth_ldap_bind_password" id="auth_ldap_bind_password" value="{{ ldap_settings.auth_ldap_bind_password }}">
                    </div>
                    <div class="pda-input-group">
                        <label for="auth_ldap_user_search_base">auth_ldap_user_search_base</label>
                        <input type="text" class="form-control" name="auth_ldap_user_search_base" id="auth_ldap_user_search_base" value="{{ ldap_settings.auth_ldap_user_search_base }}">
                    </div>
                    <div class="pda-input-group">
                        <label for="auth_ldap_user_search_filter">auth_ldap_user_search_filter</label>
                        <textarea class="form-control" name="auth_ldap_user_search_filter" id="auth_ldap_user_search_filter" rows="5">{{ ldap_settings.auth_ldap_user_search_filter }}</textarea>
                    </div>
                <button type="submit" class="btn btn-info">Save</button>
            </form>
        </div>
        <div class="pg-column-one-third">
            <h2 class="pg-title">Settings 3</h2>

        </div>
    </div>
</section>
{% endblock %}
