services:
  postgres:
    image: postgres:16-alpine
    networks:
      pgsql:
        aliases:
          - db
          - pgsql
    volumes:
      - /etc/localtime:/etc/localtime:ro
      #- pgsql:/var/lib/postgresql/data:Z
    environment:
      - POSTGRES_PASSWORD="ThisIsGoodPasswordYes"
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      timeout: 10s
      retries: 5

  pdns-pgsql-master:
    image: pschiffe/pdns-pgsql:${PDNS_PGSQL_TAG:-latest}
    hostname: ns1.example.com
    ports:
      - 8081:8081
    networks:
      pgsql:
        ipv4_address: 172.8.0.20
        aliases:
          - pdns
    extra_hosts:
      - 'ns1.example.com:172.8.0.20'
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PDNS_gpgsql_password="ThisIsGoodPasswordYes"
      - PDNS_primary=yes
      - PDNS_api=yes
      - PDNS_api_key=secret
      - PDNS_webserver=yes
      - PDNS_webserver_address=0.0.0.0
      - PDNS_webserver_allow_from=172.8.0.1/16
      - PDNS_version_string=anonymous
      - PDNS_default_ttl=1500
      - PDNS_allow_axfr_ips=172.8.0.21
      - PDNS_only_notify=172.8.0.21
      - PDNS_gpgsql_dnssec=yes
    depends_on:
      - postgres

networks:
  pgsql:
    ipam:
      config:
        - subnet: 172.8.0.0/16
          gateway: 172.8.0.1
